{% extends 'frontend/base.html' %}

{% block title %}Search — Afya Mkononi{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto flex flex-col gap-4">

    <div>
        <h1 class="text-2xl font-bold text-foreground">Search</h1>
        <p class="text-foreground/60 text-sm mt-0.5">Find your appointments, reminders and conversations.</p>
    </div>

    <div class="bg-background rounded-card shadow-card p-3">
        <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-foreground/40 ml-1 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
            <input type="search" id="search-input" value="{{ q }}" autofocus autocomplete="off"
                   placeholder="Start typing to search…"
                   class="flex-1 min-w-0 py-1.5 text-sm bg-transparent focus:outline-none text-foreground placeholder:text-foreground/40">
            <span id="search-spinner" class="hidden w-4 h-4 border-2 border-accent/30 border-t-accent rounded-full animate-spin shrink-0 mr-1"></span>
        </div>
    </div>

    <div id="search-results" class="flex flex-col gap-4">
        <p class="text-sm text-foreground/50 text-center py-6">Type above to see results.</p>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
    const input = document.getElementById('search-input');
    const box = document.getElementById('search-results');
    const spinner = document.getElementById('search-spinner');
    const endpoint = "{% url 'frontend:search-results' %}";
    let timer = null;
    let controller = null;

    const GROUPS = [
        { key: 'appointments', label: 'Appointments' },
        { key: 'reminders', label: 'Reminders' },
        { key: 'conversations', label: 'Conversations' },
    ];

    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s == null ? '' : s;
        return d.innerHTML;
    }

    function render(data) {
        const total = GROUPS.reduce((n, g) => n + (data[g.key] || []).length, 0);
        if (!data.query) {
            box.innerHTML = '<p class="text-sm text-foreground/50 text-center py-6">Type above to see results.</p>';
            return;
        }
        if (total === 0) {
            box.innerHTML = '<p class="text-sm text-foreground/50 text-center py-6">No results for “' + esc(data.query) + '”.</p>';
            return;
        }
        let html = '';
        for (const g of GROUPS) {
            const items = data[g.key] || [];
            if (!items.length) continue;
            html += '<div class="bg-background rounded-card shadow-card p-4">';
            html += '<h2 class="text-xs font-semibold text-foreground/55 uppercase tracking-wide mb-2">' + g.label + '</h2>';
            html += '<ul class="flex flex-col divide-y divide-border/70">';
            for (const it of items) {
                html += '<li class="py-2.5 first:pt-0 last:pb-0">'
                     +  '<a href="' + esc(it.url) + '" class="block hover:bg-muted -mx-2 px-2 py-1 rounded-soft transition">'
                     +  '<div class="text-sm font-medium text-foreground truncate">' + esc(it.title) + '</div>'
                     +  '<div class="text-xs text-foreground/55">' + esc(it.subtitle) + '</div>'
                     +  '</a></li>';
            }
            html += '</ul></div>';
        }
        box.innerHTML = html;
    }

    async function run() {
        const q = input.value.trim();
        if (controller) controller.abort();
        controller = new AbortController();
        spinner.classList.remove('hidden');
        try {
            const resp = await fetch(endpoint + '?q=' + encodeURIComponent(q), {
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
                signal: controller.signal,
            });
            const data = await resp.json();
            render(data);
        } catch (e) {
            if (e.name !== 'AbortError') {
                box.innerHTML = '<p class="text-sm text-danger text-center py-6">Something went wrong. Please try again.</p>';
            }
        } finally {
            spinner.classList.add('hidden');
        }
    }

    input.addEventListener('input', function () {
        clearTimeout(timer);
        timer = setTimeout(run, 250);  // debounce
    });

    if (input.value.trim()) run();
})();
</script>
{% endblock %}
